name: Manual Build SimStudio (ubuntu-latest)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push simstudio image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push simstudio
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/app.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/simstudioai/simstudio:latest
          provenance: false
