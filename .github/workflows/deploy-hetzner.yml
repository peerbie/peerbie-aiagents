name: Deploy AI Studio to Hetzner

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Helm deploy to K3s (peerbie-prod)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > /tmp/kubeconfig
          echo "KUBECONFIG=/tmp/kubeconfig" >> $GITHUB_ENV

      - name: Helm upgrade/install AI Studio
        run: |
          helm upgrade --install simstudio ./helm/sim \
            --namespace peerbie-prod \
            --create-namespace \
            -f helm/sim/values-peerbie.yaml \
            --set app.env.BETTER_AUTH_SECRET="${{ secrets.STUDIO_BETTER_AUTH_SECRET }}" \
            --set app.env.ENCRYPTION_KEY="${{ secrets.STUDIO_ENCRYPTION_KEY }}" \
            --set app.env.INTERNAL_API_SECRET="${{ secrets.STUDIO_INTERNAL_API_SECRET }}" \
            --set app.env.CRON_SECRET="${{ secrets.STUDIO_CRON_SECRET }}" \
            --set app.env.API_ENCRYPTION_KEY="${{ secrets.STUDIO_API_ENCRYPTION_KEY }}" \
            --set app.env.ADMIN_API_KEY="${{ secrets.STUDIO_ADMIN_API_KEY }}" \
            --set realtime.env.BETTER_AUTH_SECRET="${{ secrets.STUDIO_BETTER_AUTH_SECRET }}" \
            --set postgresql.auth.password="${{ secrets.STUDIO_DB_PASSWORD }}" \
            --timeout 5m \
            --wait

      - name: Verify deployment
        run: |
          echo "=== Pods ==="
          kubectl get pods -n peerbie-prod -l app.kubernetes.io/instance=simstudio
          echo "=== Services ==="
          kubectl get svc -n peerbie-prod | grep simstudio
